<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Distributed Server Health Monitor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-body">

  <div class="position-fixed top-0 end-0 p-3">
    <button class="btn btn-theme-toggle" id="theme-toggle-btn" title="Toggle Theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
  </div>

  <div class="container" style="max-width: 480px;">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
        <i class="bi bi-shield-check"></i>
      </div>
      <h3 class="fw-bold mb-1">ServerPulse Enterprise</h3>
      <p class="text-muted small">Distributed Health Monitoring & Failure Detection System</p>
    </div>

    <div class="card card-custom shadow-lg">
      <div class="card-body p-4">
        <!-- Tabs -->
        <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active fw-semibold" id="login-tab" data-bs-toggle="pill" data-bs-target="#tab-login" type="button" role="tab">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link fw-semibold" id="register-tab" data-bs-toggle="pill" data-bs-target="#tab-register" type="button" role="tab">
              <i class="bi bi-person-plus me-1"></i> Register Admin
            </button>
          </li>
        </ul>

        <!-- Alert messages -->
        <div id="auth-alert" class="alert d-none mb-3" role="alert"></div>

        <div class="tab-content" id="authTabContent">
          <!-- Login Form -->
          <div class="tab-pane fade show active" id="tab-login" role="tabpanel">
            <form id="form-login">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Username or Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" name="identifier" id="login-identifier" value="admin" required placeholder="admin or email">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" name="password" id="login-password" value="admin123" required placeholder="••••••••">
                </div>
              </div>

              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary fw-semibold py-2" id="btn-submit-login">
                  Sign In to Dashboard
                </button>
              </div>

              <!-- Quick Evaluation Hint -->
              <div class="mt-3 p-2 rounded bg-body-tertiary border text-center small text-muted">
                <i class="bi bi-info-circle text-primary me-1"></i> Default credentials: <strong>admin</strong> / <strong>admin123</strong>
              </div>
            </form>
          </div>

          <!-- Register Form -->
          <div class="tab-pane fade" id="tab-register" role="tabpanel">
            <form id="form-register">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Username</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                  <input type="text" class="form-control" name="regUsername" required placeholder="admin_lead">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" name="regEmail" required placeholder="admin@domain.com">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-semibold">Master Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                  <input type="password" class="form-control" name="regPassword" minlength="6" required placeholder="At least 6 characters">
                </div>
              </div>

              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-success fw-semibold py-2" id="btn-submit-register">
                  Create Admin Account
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="text-center mt-4 text-muted small">
      &copy; 2026 Distributed Systems Monitoring Platform &bull; FSM Powered
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Handle Login Form
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('login-identifier').value.trim();
      const password = document.getElementById('login-password').value;
      const alertEl = document.getElementById('auth-alert');
      const submitBtn = document.getElementById('btn-submit-login');

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';
        alertEl.classList.add('d-none');

        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password }),
        });

        const data = await res.json();
        if (data.success && data.token) {
          setAuthSession(data.token, data.admin);
          showToast('Login successful! Redirecting...', 'success');
          const urlParams = new URLSearchParams(window.location.search);
          const returnUrl = urlParams.get('returnUrl') || 'dashboard.html';
          setTimeout(() => {
            window.location.href = returnUrl;
          }, 600);
        } else {
          alertEl.className = 'alert alert-danger';
          alertEl.textContent = data.message || 'Invalid username or password.';
          alertEl.classList.remove('d-none');
        }
      } catch (err) {
        alertEl.className = 'alert alert-danger';
        alertEl.textContent = `Error: ${err.message}`;
        alertEl.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In to Dashboard';
      }
    });

    // Handle Register Form
    document.getElementById('form-register').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const username = form.regUsername.value.trim();
      const email = form.regEmail.value.trim();
      const password = form.regPassword.value;
      const alertEl = document.getElementById('auth-alert');
      const submitBtn = document.getElementById('btn-submit-register');

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Registering...';
        alertEl.classList.add('d-none');

        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password }),
        });

        const data = await res.json();
        if (data.success && data.token) {
          setAuthSession(data.token, data.admin);
          showToast('Administrator registered successfully!', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 600);
        } else {
          alertEl.className = 'alert alert-danger';
          alertEl.textContent = data.message || 'Registration failed.';
          alertEl.classList.remove('d-none');
        }
      } catch (err) {
        alertEl.className = 'alert alert-danger';
        alertEl.textContent = `Error: ${err.message}`;
        alertEl.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Create Admin Account';
      }
    });
  </script>
</body>
</html>
