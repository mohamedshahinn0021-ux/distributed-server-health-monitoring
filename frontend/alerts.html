<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Failure Alerts - Distributed Server Monitor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-wrapper">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <i class="bi bi-shield-check"></i>
        </div>
        <div class="brand-text">
          <h5>ServerPulse</h5>
          <small>Distributed FSM Monitor</small>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Navigation</div>
        <a href="dashboard.html" class="sidebar-link">
          <i class="bi bi-speedometer2"></i>
          <span>Dashboard</span>
        </a>
        <a href="servers.html" class="sidebar-link">
          <i class="bi bi-hdd-network"></i>
          <span>Server Management</span>
        </a>
        <a href="monitoring.html" class="sidebar-link">
          <i class="bi bi-broadcast"></i>
          <span>Live Console</span>
        </a>

        <div class="nav-section-title">Diagnostics</div>
        <a href="alerts.html" class="sidebar-link active">
          <i class="bi bi-bell"></i>
          <span>Failure Alerts</span>
        </a>
        <a href="history.html" class="sidebar-link">
          <i class="bi bi-clock-history"></i>
          <span>Historical Analytics</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-snippet">
          <div class="user-avatar">
            <i class="bi bi-person-fill"></i>
          </div>
          <div>
            <div class="user-display-email small fw-bold text-white text-truncate" style="max-width: 130px;">admin</div>
            <div class="text-muted" style="font-size: 0.68rem;">System Admin</div>
          </div>
        </div>
        <a href="#" class="action-logout text-danger fs-5" title="Sign Out">
          <i class="bi bi-box-arrow-right"></i>
        </a>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="app-main">
      <header class="app-header">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-secondary d-lg-none" onclick="document.getElementById('sidebar').classList.toggle('show')">
            <i class="bi bi-list fs-5"></i>
          </button>
          <div class="header-title">
            <h4>Failure Detection & Alert History</h4>
          </div>
        </div>

        <div class="header-actions">
          <button class="btn btn-theme-toggle" id="theme-toggle-btn" title="Toggle Theme">
            <i class="bi bi-moon-stars-fill"></i>
          </button>
          <button class="btn btn-sm btn-outline-success" id="btn-mark-all-read">
            <i class="bi bi-check-all me-1"></i> Mark All Read
          </button>
          <button class="btn btn-sm btn-outline-danger" id="btn-clear-all-alerts">
            <i class="bi bi-trash me-1"></i> Clear All
          </button>
        </div>
      </header>

      <div class="p-4">
        <!-- Filter Bar -->
        <div class="card card-custom mb-4">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Filter by Severity</label>
                <select id="filter-severity" class="form-select">
                  <option value="ALL">All Severities</option>
                  <option value="CRITICAL">CRITICAL (Downtime & Failure)</option>
                  <option value="WARNING">WARNING (High Latency / Degraded)</option>
                  <option value="INFO">INFO (Recovery in Progress)</option>
                  <option value="SUCCESS">SUCCESS (Restored / Stabilized)</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Filter by Read Status</label>
                <select id="filter-read-status" class="form-select">
                  <option value="ALL">All Statuses</option>
                  <option value="UNREAD">Unread Only</option>
                  <option value="READ">Read Only</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Alerts List Container -->
        <div id="alerts-container">
          <div class="text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm me-2"></div>
            Loading alert repository...
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/alerts.js"></script>
</body>
</html>
