# ========================================================================
# MySQL Database Configuration Profile
# Use this when running with a local or remote MySQL Server
# ========================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/server_monitor_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate DDL auto mode (update will automatically adjust tables if needed)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Optional: Initialize SQL scripts automatically if desired
spring.sql.init.mode=never
