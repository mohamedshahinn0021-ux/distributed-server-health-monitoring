# ========================================================================
# Distributed Server Health Monitoring and Failure Detection System
# MongoDB Configuration & Application Properties
# ========================================================================

spring.application.name=distributed-server-monitor
server.port=8080

# ------------------------------------------------------------------------
# MongoDB Database Connection
# ------------------------------------------------------------------------
# Local MongoDB Server (Community / Enterprise):
spring.data.mongodb.uri=mongodb://localhost:27017/server_monitor_db

# MongoDB Atlas (Cloud) connection format:
# spring.data.mongodb.uri=mongodb+srv://<username>:<password>@<cluster>.mongodb.net/server_monitor_db?retryWrites=true&w=majority

# Automatically build unique indexes (e.g. admin username)
spring.data.mongodb.auto-index-creation=true

# ------------------------------------------------------------------------
# Health Check & Finite State Machine (FSM) Engine Settings
# ------------------------------------------------------------------------
server.monitor.enabled=true
server.monitor.interval-ms=15000
server.monitor.connect-timeout-ms=3000
server.monitor.recovery-stability-count=3
server.monitor.default-slow-threshold-ms=500

# Logging
logging.level.com.servermonitor=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.web=INFO
