# ========================================================================
# Distributed Server Health Monitoring and Failure Detection System
# Core Application Configuration
# ========================================================================

spring.application.name=distributed-server-monitor
server.port=8080

# Active Profile: 'mysql' for MySQL Database, 'h2' for embedded zero-config mode
# Set to 'mysql' when running with MySQL Workbench / MySQL Server
spring.profiles.active=mysql

# Health Check & FSM Parameters
server.monitor.enabled=true
server.monitor.interval-ms=15000
server.monitor.connect-timeout-ms=3000
server.monitor.recovery-stability-count=3
server.monitor.default-slow-threshold-ms=500

# JPA and Hibernate Base Settings
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging configuration
logging.level.com.servermonitor=INFO
logging.level.org.springframework.web=INFO
