<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Distributed Server Health Monitoring</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; border-radius: 14px; background: linear-gradient(135deg, #4e73df, #224abe); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; box-shadow: 0 8px 16px rgba(78, 115, 223, 0.4);">
          <i class="fas fa-network-wired"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">Server Monitor Portal</h4>
        <p class="text-muted small">Distributed Health Monitoring & Failure Detection</p>
      </div>

      <!-- Alert placeholder -->
      <div id="login-alert" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

      <form id="login-form">
        <div class="mb-3">
          <label for="username" class="form-label small fw-bold text-secondary">Admin Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-user-shield"></i></span>
            <input type="text" class="form-control border-start-0" id="username" placeholder="e.g. admin" value="admin" required autofocus>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label small fw-bold text-secondary">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control border-start-0 border-end-0" id="password" placeholder="Enter password" value="admin123" required>
            <button class="btn btn-outline-light border text-muted" type="button" id="toggle-password-btn" onclick="togglePasswordVisibility()">
              <i class="fas fa-eye" id="toggle-password-icon"></i>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember-me" checked>
            <label class="form-check-label small text-muted" for="remember-me">Remember session</label>
          </div>
          <span class="badge bg-primary-subtle text-primary border" style="cursor: pointer;" onclick="autofillDemo()">
            <i class="fas fa-key me-1"></i>Demo: admin / admin123
          </span>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
          <i class="fas fa-sign-in-alt me-2"></i>Sign In to Dashboard
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-center text-muted" style="font-size: 0.78rem;">
        <i class="fas fa-shield-alt text-success me-1"></i> Finite State Machine Failure Detection System
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('toggle-password-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    function autofillDemo() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'admin123';
    }
  </script>
</body>
</html>
